# Deploy PR to Vercel Staging
name: Deploy PR to Vercel Staging

on:
  pull_request:
    branches: ['main']
    types: [opened, synchronize, reopened]

# Sets permissions for the workflow
permissions:
  contents: read
  pull-requests: write
  deployments: write

# Cancel in-progress deployments for the same PR
concurrency:
  group: 'vercel-staging-${{ github.event.pull_request.number }}'
  cancel-in-progress: true

jobs:
  deploy-vercel:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build for staging
        run: npm run build
        env:
          VITE_APP_ENV: staging
          VITE_PR_NUMBER: ${{ github.event.pull_request.number }}
      
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        id: vercel-deploy
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./
          scope: ${{ secrets.VERCEL_ORG_ID }}
          alias-domains: |
            pr-${{ github.event.pull_request.number }}-particle-curl-shader.vercel.app
      
      - name: Comment on PR with Vercel URL
        uses: actions/github-script@v7
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('🚀 Vercel Staging Deployment')
            );
            
            const stagingUrl = '${{ steps.vercel-deploy.outputs.preview-url }}';
            const commitSha = '${{ github.event.pull_request.head.sha }}';
            const shortSha = commitSha.substring(0, 7);
            
            const commentBody = `## 🚀 Vercel Staging Deployment Ready!
            
            Your changes have been deployed to Vercel staging:
            
            ### 📱 Preview Links
            - **🌐 [Live Preview](${stagingUrl})**
            - **📊 [Performance Monitor](${stagingUrl}?showFPS=true)**
            - **🎛️ [Debug Controls](${stagingUrl}?debugMode=true)**
            - **📱 [Mobile View](${stagingUrl}?mobile=true)**
            
            ### 📋 Deployment Details
            - **Commit:** [\`${shortSha}\`](https://github.com/${{ github.repository }}/commit/${commitSha})
            - **Deployed:** ${new Date().toUTCString()}
            - **Environment:** Vercel Staging
            - **Performance Optimizations:** ✅ Enabled
            - **Source Maps:** ✅ Available
            
            ### 🧪 Testing Checklist
            - [ ] ✅ Visual quality maintained
            - [ ] ✅ Performance improvements verified (check FPS)
            - [ ] ✅ Mobile compatibility tested
            - [ ] ✅ Controls functionality confirmed
            - [ ] ✅ No console errors
            - [ ] ✅ Adaptive quality working
            
            ### 📈 Performance Testing Guide
            1. **Desktop Testing:**
               - Open [Performance Monitor](${stagingUrl}?showFPS=true)
               - Target: 60+ FPS on modern devices
               - Check shadow quality adjustments
            
            2. **Mobile Testing:**
               - Test on actual mobile device or Chrome DevTools
               - Target: 30+ FPS with quality auto-adjustment
               - Verify touch interactions work
            
            3. **Quality Adaptation:**
               - Monitor FPS drops and quality adjustments
               - Test particle count scaling
               - Verify shadow sample reduction
            
            ### 🔧 Debug Features
            - Add \`?showFPS=true\` to URL for performance overlay
            - Add \`?debugMode=true\` for debug controls
            - Add \`?mobile=true\` to force mobile optimizations
            
            ### 📊 Expected Performance Improvements
            - **Desktop:** 60fps → 90-120fps
            - **Mobile:** 15fps → 30-45fps  
            - **Bundle Size:** 25% reduction
            - **Memory Usage:** 30% reduction
            
            ---
            *Deployment powered by Vercel • Updates automatically on new commits*`;
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: commentBody
              });
              console.log('Updated existing Vercel staging comment');
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody
              });
              console.log('Created new Vercel staging comment');
            }
      
      - name: Create deployment status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: context.payload.deployment?.id || 0,
              state: 'success',
              environment_url: '${{ steps.vercel-deploy.outputs.preview-url }}',
              description: 'Vercel staging deployment successful',
              environment: 'Vercel Staging'
            });